<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moasic — Photo Mosaic</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Moasic</h1>
      <p>Turn a photo into a tile mosaic</p>
    </header>

    <main>
      <section class="panel controls">
        <label class="field">
          <span>Target photo</span>
          <input type="file" id="target-input" accept="image/*" />
        </label>
        <label class="field">
          <span>Tile photos (optional — use many small images)</span>
          <input type="file" id="tiles-input" accept="image/*" multiple />
        </label>
        <div class="row">
          <label class="field">
            <span>Columns</span>
            <input type="number" id="cols" min="8" max="120" value="40" />
          </label>
          <label class="field">
            <span>Rows</span>
            <input type="number" id="rows" min="8" max="120" value="30" />
          </label>
        </div>
        <label class="field checkbox">
          <input type="checkbox" id="use-self-tiles" checked />
          <span>If no tiles uploaded, slice the target into tile pieces</span>
        </label>
        <button type="button" id="generate" disabled>Generate mosaic</button>
        <button type="button" id="download" disabled>Download PNG</button>
      </section>

      <section class="panel preview">
        <canvas id="canvas"></canvas>
        <p id="status">Upload a target photo to start.</p>
      </section>
    </main>

    <script src="mosaic.js"></script>
  </body>
</html>
